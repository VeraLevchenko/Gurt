{% extends "base.html" %}
{% block content %}
    <h1>Создать юридическое лицо</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form id="subject_form" method="post" action="{{ url_for('subjects.create_subject', subject_type='legal', redirect='list') }}" accept-charset="UTF-8">
        <div class="contract-details">
            <p>
                <label for="name">Наименование:</label>
                <input type="text" id="name" name="name" value="{{ form_data.get('name', '') }}" required>
            </p>
            <p>
                <label for="inn">ИНН:</label>
                <input type="text" id="inn" name="inn" value="{{ form_data.get('inn', '') }}" required>
            </p>
            <p>
                <label for="legal_address">Юридический адрес:</label>
                <input type="text" id="legal_address" name="legal_address" value="{{ form_data.get('legal_address', '') }}" required>
            </p>
            <p>
                <label for="director_full_name">ФИО директора:</label>
                <input type="text" id="director_full_name" name="director_full_name" value="{{ form_data.get('director_full_name', '') }}" required>
            </p>
            <p>
                <label for="payment_details">Реквизиты для оплаты:</label>
                <textarea id="payment_details" name="payment_details" required>{{ form_data.get('payment_details', '') }}</textarea>
            </p>
            <p>
                <label for="phone">Телефон:</label>
                <input type="text" id="phone" name="phone" value="{{ form_data.get('phone', '') }}" required>
            </p>
            <p>
                <label for="email">Email (необязательно):</label>
                <input type="email" id="email" name="email" value="{{ form_data.get('email', '') }}">
            </p>
            <p>
                <button type="submit" class="create-btn">Сохранить</button>
                <button type="button" class="cancel-btn" id="cancel-btn">Отмена</button>
            </p>
        </div>
    </form>
    <script>
        const form = document.getElementById('subject_form');
        const cancelBtn = document.getElementById('cancel-btn');
        const isRedirectList = new URLSearchParams(window.location.search).get('redirect') === 'list';

        cancelBtn.addEventListener('click', function() {
            if (isRedirectList) {
                window.location.href = '{{ url_for("subjects.legal_entities") }}';
            } else {
                if (window.opener) {
                    window.close();
                } else {
                    closeSubjectModal();
                }
            }
        });

        if (!isRedirectList) {
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                const formData = new FormData(form);
                fetch('{{ url_for("subjects.create_subject", subject_type="legal") }}', {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(data => { throw new Error(data.error || 'Ошибка сервера'); });
                    }
                    return response.text();
                })
                .then(html => {
                    if (window.opener) {
                        window.opener.document.getElementById('modalContent').innerHTML = html;
                        window.opener.document.getElementById('subjectModal').style.display = 'block';
                        window.close();
                    } else {
                        let modal = document.getElementById('subjectModal');
                        if (!modal) {
                            modal = document.createElement('div');
                            modal.id = 'subjectModal';
                            modal.className = 'modal';
                            modal.innerHTML = `<div class="modal-content"><span class="close" onclick="closeSubjectModal()">×</span><div id="modalContent"></div></div>`;
                            document.body.appendChild(modal);
                        }
                        document.getElementById('modalContent').innerHTML = html;
                        modal.style.display = 'block';
                    }
                })
                .catch(error => {
                    alert('Ошибка при создании юридического лица: ' + error.message);
                });
            });
        }

        function closeSubjectModal() {
            const modal = document.getElementById('subjectModal');
            if (modal) modal.style.display = 'none';
        }
    </script>
{% endblock %}
