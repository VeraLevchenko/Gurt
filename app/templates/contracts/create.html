{% extends "base.html" %}
{% block content %}
    <h1>Создать новый договор</h1>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <div class="contract-details">
        <form action="{{ url_for('contracts.create_contract') }}" method="post">
            <p>
                <label for="number">Номер:</label>
                <input type="text" id="number" name="number" required>
            </p>
            <p>
                <label for="contract_date">Дата:</label>
                <input type="date" id="contract_date" name="contract_date" required>
            </p>
            <p>
                <label for="subject">Субъект:</label>
                <input type="text" id="subject" name="subject" required>
            </p>
            <p>
                <label for="price">Цена:</label>
                <input type="number" step="0.01" id="price" name="price" value="0.00" readonly>
            </p>
            <p>
                <label for="address">Адрес:</label>
                <input type="text" id="address" name="address" required>
            </p>
            <p>
                <label>Наименование работ:</label>
                <div class="work-types">
                    {% for work_type in work_types %}
                        <div class="work-type-item">
                            <input type="checkbox" name="work_description" value="{{ work_type.id }}"
                                   data-price="{{ work_type.price }}" id="work_{{ work_type.id }}"
                                   onchange="updatePrice()">
                            <label for="work_{{ work_type.id }}">{{ work_type.name }} ({{ work_type.price }} руб.)</label>
                        </div>
                    {% endfor %}
                </div>
            </p>
            <p>
                <button type="submit" class="create-btn">Сохранить</button>
                <a href="{{ url_for('contracts.list_contracts') }}" class="cancel-btn">Отмена</a>
            </p>
        </form>
    </div>
    <style>
        .work-types {
            margin-top: 10px;
        }
        .work-type-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .work-type-item input[type="checkbox"] {
            margin-right: 10px;
        }
        .work-type-item label {
            margin: 0;
        }
    </style>
    <script>
        function updatePrice() {
            const checkboxes = document.querySelectorAll('input[name="work_description"]:checked');
            let totalPrice = 0;
            checkboxes.forEach(checkbox => {
                totalPrice += parseFloat(checkbox.getAttribute('data-price'));
            });
            document.getElementById('price').value = totalPrice.toFixed(2);
        }
    </script>
{% endblock %}
